[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-clash"
version = "0.1.0"
description = "A neural showdown arena for AI-on-AI debate with human intervention."
dependencies = [
    "streamlit",
    "ollama",
]

[project.scripts]
clash = "context_clash.cli:main"
